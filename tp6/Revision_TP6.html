<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision TP6 Web API</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --panel2:#f0f2f8; --text:#1d2233; --muted:#5d6479; --border:#dfe3ee;
  --accent:#4f46e5; --accent-soft:#eceafd; --ok:#15803d; --ok-soft:#e5f6ea; --bad:#b91c1c; --bad-soft:#fdeaea;
  --warn:#b45309; --warn-soft:#fdf3e1; --key:#0e7490; --key-soft:#e2f5f8;
  --code-bg:#1e2130; --code-text:#e6e9f2; --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131a; --panel:#191c26; --panel2:#20242f; --text:#e7e9f0; --muted:#9aa1b5; --border:#2c3140;
    --accent:#8b83ff; --accent-soft:#25234a; --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1a1a;
    --warn:#fbbf24; --warn-soft:#352a12; --key:#5fd3e6; --key-soft:#123038;
    --code-bg:#0d0f15; --code-text:#e6e9f2; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11131a; --panel:#191c26; --panel2:#20242f; --text:#e7e9f0; --muted:#9aa1b5; --border:#2c3140;
  --accent:#8b83ff; --accent-soft:#25234a; --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1a1a;
  --warn:#fbbf24; --warn-soft:#352a12; --key:#5fd3e6; --key-soft:#123038;
  --code-bg:#0d0f15; --code-text:#e6e9f2; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea,.blank{font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.prog{flex:1;min-width:120px}
.prog .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.prog .lbl{font-size:12px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px 20px 80px}
nav.side{position:sticky;top:76px;align-self:start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
nav.side button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--text);padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit;font-size:14.5px}
nav.side button:hover{background:var(--panel2)}
nav.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .num{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:12.5px;font-weight:700}
nav.side button.on .num{background:var(--accent);color:#fff}
nav.side .sc{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.side .sc.full{color:var(--ok);font-weight:700}
main{min-width:0}

/* ---------- lesson ---------- */
.hero{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:22px}
.hero .k{opacity:.85;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.hero h1{margin:4px 0 6px;font-size:28px;line-height:1.25}
.hero p{margin:0;opacity:.92}
.hero .pdf{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;font-size:13px}
section.blk{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 26px;margin-bottom:20px;box-shadow:var(--shadow)}
section.blk>h2{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
section.blk>h2 .tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.cours h3{font-size:17px;margin:22px 0 8px;color:var(--accent)}
.cours h3:first-child{margin-top:0}
.cours p{margin:8px 0}
.cours ul{margin:8px 0;padding-left:22px}
.cours li{margin:4px 0}
:not(pre)>code{background:var(--panel2);border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:.88em}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14.5px}
.tbl{overflow-x:auto}
th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600}
.note{border-left:4px solid var(--key);background:var(--key-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.tip{border-color:var(--ok);background:var(--ok-soft)}
.note b.t{display:block;margin-bottom:2px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:12px 0}
.flow .st{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.flow .st b{display:block}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--accent);font-weight:700}

/* ---------- code ---------- */
pre.code{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.8px;line-height:1.6;margin:10px 0;tab-size:4}
.cap{font-size:12.5px;color:var(--muted);margin:10px 0 -6px}
.k1{color:#c792ea}.k2{color:#7fdbca}.k3{color:#ffcb6b}.k4{color:#f78c6c}.k5{color:#7a8299;font-style:italic}.k6{color:#addb67}

/* ---------- QCM ---------- */
.q{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--panel)}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qt .n{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--panel);text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.expl{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:14.5px;display:none}
.expl.show{display:block}
.expl.ok{background:var(--ok-soft)}
.expl.ko{background:var(--bad-soft)}

/* ---------- fill / write ---------- */
.ex{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:14px 0}
.ex h4{margin:0 0 4px;font-size:16px}
.ex .d{color:var(--muted);font-size:14.5px;margin:0 0 6px}
.blank{background:#2a2f44;color:#fff;border:0;border-bottom:2px dashed #8b83ff;border-radius:4px;padding:0 4px;font-size:13.5px;outline:none;min-width:2.5ch}
.blank:focus{background:#353b57;border-bottom-style:solid}
.blank.ok{border-bottom:2px solid #4ade80;background:#173524}
.blank.ko{border-bottom:2px solid #f87171;background:#3f1d1d}
.blank.shown{border-bottom:2px solid #fbbf24;background:#3a3016}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.res{font-size:14px;font-weight:600}
.res.ok{color:var(--ok)}.res.ko{color:var(--bad)}
textarea.w{width:100%;min-height:170px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.8px;line-height:1.55;resize:vertical;tab-size:4}
.sol{display:none}
.sol.show{display:block}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:10px}

/* ---------- TP6 complet ---------- */
.pdfq{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0 10px}
.xq{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:16px 0}
.xq h4{margin:0 0 6px;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xq h4 .qn{background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px}
.xq h4 .ok{margin-left:auto;color:var(--ok);font-size:13px;font-weight:700}
.chk{list-style:none;padding:10px 12px;margin:10px 0 0;font-size:14.5px;background:var(--panel2);border-radius:10px;display:none}
.chk.show{display:block}
.chk li{padding:4px 0}
.chk li .h{display:block;margin-left:26px;color:var(--muted);font-size:13.5px}
.chk .sum{font-weight:700;margin-bottom:4px}
.exsum{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;font-size:13px;margin-left:6px}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:16px 16px 70px}
  nav.side{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  nav.side button{flex:none;width:auto;white-space:nowrap}
  nav.side .sc,nav.side .tx{display:none}
  .top-in{padding:10px 16px;flex-wrap:wrap}
  .brand small{display:none}
  section.blk{padding:16px}
  .hero{padding:20px}
  .hero h1{font-size:22px}
}
@media print{
  header.top,nav.side,.acts,.pager,.btn{display:none!important}
  .wrap{display:block;padding:0}
  .lesson{display:block!important;page-break-after:always}
  .sol,.expl{display:block!important}
  section.blk{box-shadow:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">C#</div><div>Révision TP6<small>Web API · ASP.NET Core · Entity Framework</small></div></div>
    <div class="prog"><div class="bar"><i id="gbar"></i></div><div class="lbl" id="glbl"></div></div>
    <button class="btn" id="theme" title="Changer de thème">◐ Thème</button>
    <button class="btn" id="reset" title="Effacer toutes mes réponses">↺ Recommencer</button>
  </div>
</header>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   CONTENU — 7 leçons + mémo
   Blocs de cours : h (titre), p (html), code (texte brut), table, note, list, flow
   Code à compléter : ⟦réponse⟧  —  plusieurs réponses acceptées : ⟦a‖b⟧
   ===================================================================== */
const R = String.raw;

const LESSONS = [
/* ---------------------------------------------------------------- 1 */
{
  title:"Le grand plan et les classes",
  pdf:"Question 1 (début)",
  intro:"Comprendre à quoi sert chaque partie d'une Web API, et écrire une classe C# avec les bons types.",
  cours:[
    {t:'h',v:"C'est quoi une Web API ?"},
    {t:'p',v:"Une <b>Web API</b> est un programme qui attend des <b>requêtes HTTP</b> et répond avec des <b>données en JSON</b>. Elle n'a pas de pages HTML : c'est un autre programme (Swagger, une application mobile, un site) qui l'appelle."},
    {t:'code',cap:"Une requête et sa réponse",v:R`GET /api/Compte

[ { "id": 1, "numéroCompte": 1001, "solde": 500 } ]`},
    {t:'h',v:"Le chemin d'une requête"},
    {t:'flow',v:[["Swagger","le client"],["Controller","reçoit la requête"],["Repository","fait le travail"],["AppDbContext","traduit C# → SQL"],["SQL Server","stocke les données"]]},
    {t:'table',head:["Question du PDF","Partie du projet","Rôle"],rows:[
      ["Q1","Classes <code>Client</code>, <code>Compte</code>, <code>Operation</code>","la forme des données"],
      ["Q2","<code>AppDbContext</code>","le pont vers la base"],
      ["Q3","<code>ICompteRepository</code> + <code>CompteRepository</code>","toutes les opérations sur les données"],
      ["Q4","<code>appsettings.json</code> + <code>Program.cs</code>","la configuration"],
      ["Q5","Migrations","créer la base"],
      ["Q6","<code>CompteController</code>","la porte d'entrée HTTP"]]},
    {t:'h',v:"Une classe = un modèle"},
    {t:'p',v:"Une <b>classe</b> décrit à quoi ressemble une chose. Chaque information est une <b>propriété</b>."},
    {t:'code',v:R`namespace Practice.Models
{
    public class Voiture
    {
        public int Id { get; set; }
        public string Marque { get; set; }
        public double Prix { get; set; }
        public DateTime DateAchat { get; set; }
    }
}`},
    {t:'list',v:[
      "<code>namespace</code> : le « dossier logique » où se trouve la classe.",
      "<code>public class Voiture</code> : je crée un modèle nommé <code>Voiture</code>. <code>public</code> = utilisable partout.",
      "<code>public int Id { get; set; }</code> : une propriété. <code>int</code> = le <b>type</b>, <code>Id</code> = le <b>nom</b>, <code>{ get; set; }</code> = on peut <b>lire</b> et <b>modifier</b> la valeur."]},
    {t:'table',head:["Type","Contient","Exemple"],rows:[
      ["<code>int</code>","nombre entier","<code>1001</code>"],
      ["<code>double</code>","nombre à virgule","<code>550.75</code>"],
      ["<code>string</code>","texte","<code>\"Ben Ali\"</code>"],
      ["<code>DateTime</code>","date et heure","<code>2026-10-21</code>"],
      ["<code>bool</code>","vrai / faux","<code>true</code>"]]},
    {t:'note',kind:'key',v:"<b class='t'>Convention Entity Framework</b>Une propriété nommée <code>Id</code> devient automatiquement la <b>clé primaire</b> de la table."},
    {t:'note',kind:'warn',v:"<b class='t'>Piège classique : le téléphone</b><code>Tel</code> est un <code>string</code>, pas un <code>int</code> : on ne calcule jamais avec, il peut commencer par <code>0</code> ou contenir <code>+216</code>. Règle : si on ne fait pas de calcul avec un nombre (téléphone, CIN, code postal), c'est un <code>string</code>."},
    {t:'note',kind:'tip',v:"<b class='t'>Image</b>On ne stocke pas l'image elle-même, seulement le <b>nom du fichier</b> (<code>\"photo1.jpg\"</code>) → <code>string</code>."}
  ],
  qcm:[
    {q:"Que renvoie une Web API ?",o:["Des pages HTML","Des données JSON","Des fichiers .exe","Du CSS"],a:1,e:"Une Web API renvoie des <b>données</b>, en général au format JSON. Ce sont d'autres programmes qui les affichent."},
    {q:"Quel est le bon type pour la propriété <code>Tel</code> ?",o:["<code>int</code>","<code>double</code>","<code>string</code>","<code>DateTime</code>"],a:2,e:"<code>string</code> : on ne calcule pas avec un téléphone, et un <code>int</code> perdrait le <code>0</code> du début ou le <code>+</code>."},
    {q:"Quel est le bon type pour <code>Solde</code> ?",o:["<code>int</code>","<code>double</code>","<code>string</code>","<code>bool</code>"],a:1,e:"Un solde peut avoir des décimales (550,75) → <code>double</code>. C'est aussi le type utilisé par le PDF."},
    {q:"Quelle propriété EF transforme automatiquement en clé primaire ?",o:["<code>Numero</code>","<code>Id</code>","<code>Cle</code>","<code>ClientID</code>"],a:1,e:"Par convention, <code>Id</code> (ou <code>NomClasseId</code>) = clé primaire. <code>ClientID</code> dans <code>Compte</code> est une clé <b>étrangère</b>."},
    {q:"Dans quel ordre passe une requête ?",o:["Repository → Controller → SQL Server","Controller → Repository → AppDbContext → SQL Server","AppDbContext → Controller → Repository","SQL Server → Controller → Repository"],a:1,e:"Le Controller reçoit, le Repository fait le travail, l'AppDbContext traduit en SQL, SQL Server stocke."},
    {q:"Que signifie <code>{ get; set; }</code> ?",o:["La propriété est obligatoire","On peut lire et modifier la valeur","La propriété est une clé primaire","La valeur est en lecture seule"],a:1,e:"<code>get</code> = lire, <code>set</code> = modifier."},
    {q:"Quel type pour <code>DateCréation</code> ?",o:["<code>string</code>","<code>int</code>","<code>DateTime</code>","<code>double</code>"],a:2,e:"<code>DateTime</code> contient une date et une heure, et permet de comparer et trier les dates."}
  ],
  fills:[
    {title:"Compléter la classe Client",desc:"Remplis les cases avec le bon mot-clé ou le bon type.",code:R`namespace TP6_WebApi.Models
{
    public ⟦class⟧ Client
    {
        public ⟦int⟧ Id { ⟦get⟧; ⟦set⟧; }
        public ⟦string⟧ Nom { get; set; }
        public string Prenom { get; set; }
        public ⟦string⟧ Tel { get; set; }      // téléphone
        public string Email { get; set; }
        public string Adresse { get; set; }
        public ⟦string⟧ Image { get; set; }    // nom du fichier image
    }
}`},
    {title:"Les types de la classe Compte",desc:"Choisis le type de chaque propriété du diagramme.",code:R`public class Compte
{
    public int Id { get; set; }
    public ⟦int⟧ NuméroCompte { get; set; }
    public ⟦DateTime⟧ DateCréation { get; set; }
    public ⟦double⟧ Solde { get; set; }
    public ⟦int⟧ ClientID { get; set; }
    public ⟦string⟧ TypeCompte { get; set; }
}`}
  ],
  writes:[
    {title:"Écris la classe Operation (sans annotations)",desc:"Propriétés du diagramme : Id, TypeOperation, Montant, DateOperation, CompteID. Pas encore d'annotations ni de navigation.",sol:R`namespace TP6_WebApi.Models
{
    public class Operation
    {
        public int Id { get; set; }
        public string TypeOperation { get; set; }   // "Retrait", "Versement", "Virement"
        public double Montant { get; set; }
        public DateTime DateOperation { get; set; }
        public int CompteID { get; set; }
    }
}`}
  ]
},
/* ---------------------------------------------------------------- 2 */
{
  title:"Annotations et relations",
  pdf:"Question 1 (fin)",
  intro:"Ajouter des règles de validation avec les annotations, et relier les classes entre elles (1 client → plusieurs comptes).",
  cours:[
    {t:'h',v:"Les annotations : des règles de validation"},
    {t:'p',v:"Une <b>annotation</b> se met entre <code>[ ]</code> au-dessus d'une propriété. Si les données envoyées ne respectent pas la règle, l'API répond <b>automatiquement 400 Bad Request</b>, sans que tu écrives de vérification. Il faut ajouter en haut du fichier :"},
    {t:'code',v:R`using System.ComponentModel.DataAnnotations;`},
    {t:'table',head:["Annotation","Règle","Bloque par exemple"],rows:[
      ["<code>[Required]</code>","champ obligatoire","un nom vide"],
      ["<code>[StringLength(50)]</code>","50 caractères maximum","un nom de 200 lettres"],
      ["<code>[EmailAddress]</code>","format email valide","<code>\"abc\"</code>"],
      ["<code>[Phone]</code>","format téléphone valide","<code>\"bonjour\"</code>"],
      ["<code>[Range(0, 1000)]</code>","nombre entre 0 et 1000","<code>-5</code>"],
      ["<code>[RegularExpression(\"A|B\")]</code>","valeur dans une liste","<code>\"C\"</code>"],
      ["<code>[DataType(DataType.Date)]</code>","indique que c'est une date (sans l'heure)","—"]]},
    {t:'code',cap:"Exemple",v:R`public class Voiture
{
    public int Id { get; set; }

    [Required, StringLength(30)]        // deux règles sur la même ligne
    public string Marque { get; set; }

    [Range(0, double.MaxValue)]         // le prix ne peut pas être négatif
    public double Prix { get; set; }

    public string? Photo { get; set; }  // ? = peut être vide (null)
}`},
    {t:'list',v:[
      "<code>double.MaxValue</code> = le plus grand nombre possible → « pas de limite haute ».",
      "Le <code>?</code> après un type (<code>string?</code>) = la valeur <b>peut être null</b> (vide).",
      "Dans <code>RegularExpression</code>, le <code>|</code> veut dire « ou »."]},
    {t:'h',v:"Les relations 1 → plusieurs"},
    {t:'p',v:"Le diagramme dit : <b>1 Client a plusieurs Comptes</b>, et <b>1 Compte a plusieurs Operations</b>. Une relation 1 → * s'écrit avec <b>3 éléments</b> :"},
    {t:'code',v:R`public class Proprietaire                      // côté « 1 »
{
    public int Id { get; set; }
    public string Nom { get; set; }

    public ICollection<Voiture>? Voitures { get; set; }   // ③ la liste
}

public class Voiture                           // côté « plusieurs »
{
    public int Id { get; set; }
    public string Marque { get; set; }

    var compte = await _context.Comptes.FirstOrDefaultAsync(c => c.NuméroCompte == numcompte);

        if (o.TypeOperation == "Retrait")
            compte.Solde -= o.Montant;
        else if (o.TypeOperation == "Versement")
            compte.Solde += o.Montant;

        await _context.SaveChangesAsync();

    if (compte1 != null && compte2 != null)
    {
        compte1.Solde -= m;
        compte2.Solde += m;
        await _context.SaveChangesAsync();
    }
}`}

  cours:[
    {t:'h',v:"C'est quoi une migration ?"},
    {t:'p',v:"Une <b>migration</b> est un fichier C# généré par EF qui contient les instructions pour créer ou modifier les tables : un <b>plan de construction</b>."},
    {t:'table',head:["Commande","Ce qu'elle fait","Touche à la base ?"],rows:[
      ["<code>Add-Migration InitialCreate</code>","<b>écrit le plan</b> dans le dossier <code>Migrations/</code>","❌ Non"],
      ["<code>Update-Database</code>","<b>exécute le plan</b> : crée la base et les tables","✅ Oui"]]},
    {t:'note',kind:'tip',v:"<b class='t'>Image</b><code>Add-Migration</code> = l'architecte dessine le plan. <code>Update-Database</code> = les ouvriers construisent."},
    {t:'h',v:"Où taper les commandes ?"},
    {t:'p',v:"Visual Studio → <b>Outils → Gestionnaire de package NuGet → Console du Gestionnaire de package</b>. Vérifie que le <b>Projet par défaut</b> (en haut de la console) est bien ton projet."},
    {t:'code',v:R`PM> Add-Migration InitialCreate
PM> Update-Database`},
    {t:'p',v:"<code>InitialCreate</code> est un nom au choix qui décrit la migration. Équivalent en terminal : <code>dotnet ef migrations add InitialCreate</code> puis <code>dotnet ef database update</code>."},
    {t:'h',v:"Ce que génère Add-Migration"},
    {t:'code',v:R`Migrations/
├── 20261021095238_InitialCreate.cs           ← le plan : CreateTable(...)
├── 20261021095238_InitialCreate.Designer.cs  ← infos techniques
└── AppDbContextModelSnapshot.cs              ← « photo » des classes actuelles`},
    {t:'code',cap:"Extrait du plan : on reconnaît la classe Compte",v:R`migrationBuilder.CreateTable(
    name: "Comptes",
    columns: table => new
    {
        Id = table.Column<int>(nullable: false).Annotation("SqlServer:Identity", "1, 1"),
        NuméroCompte = table.Column<int>(nullable: false),
        Solde = table.Column<double>(nullable: false),
        ClientID = table.Column<int>(nullable: false),
    },
    constraints: table =>
    {
        table.PrimaryKey("PK_Comptes", x => x.Id);
        table.ForeignKey("FK_Comptes_Clients_ClientID", x => x.ClientID, "Clients", "Id");
    });`},
    {t:'list',v:[
      "<code>Identity 1, 1</code> : l'Id se remplit tout seul (1, 2, 3…) → on ne le donne pas en créant un compte.",
      "<code>PrimaryKey</code> sur <code>Id</code>, <code>ForeignKey</code> sur <code>ClientID</code>.",
      "<b>Pas de colonne</b> <code>Client</code> ni <code>Operation</code> : les navigations ne sont pas des colonnes."]},
    {t:'h',v:"Vérifier la base"},
    {t:'p',v:"<b>Affichage → Explorateur d'objets SQL Server</b> → <code>(localdb)\\MSSQLLocalDB</code> → Bases de données → <code>bd</code> → Tables : <code>Clients</code>, <code>Comptes</code>, <code>Operations</code> et <code>__EFMigrationsHistory</code> (liste des migrations déjà appliquées)."},

PM> Add-Migration AjoutVilleClient

    {t:'code',v:R`using Microsoft.AspNetCore.Mvc;
using TP6_WebApi.Models;
using TP6_WebApi.Repositories;

namespace TP6_WebApi.Controllers
{
    [Route("api/[controller]")]                      // ① adresse de base : api/Compte
    [ApiController]                                  // ② validation automatique (400)
    public class CompteController : ControllerBase   // ③ donne Ok(), NotFound()...
    {
        private readonly ICompteRepository _repository;          // ④ injection

        public CompteController(ICompteRepository repository)
        {
            _repository = repository;
        }

        // ... les actions
    }
}`},

    {t:'code',cap:"Afficher un compte",v:R`[HttpGet("{id:int}")]
public async Task<ActionResult<Compte>> GetCompte(int id)
{
    var compte = await _repository.GetById(id);   // ① charger
    if (compte == null)                           // ② vérifier
        return NotFound();                        //    404
    return Ok(compte);                            // ④ répondre 200
}`},
    {t:'code',cap:"Créer un compte (vérifier que le client existe)",v:R`[HttpPost]
public async Task<ActionResult<Compte>> CreateCompte(Compte c)      // c vient du JSON
{
    if (!await _context.Clients.AnyAsync(cl => cl.Id == c.ClientID))
        return BadRequest("Client inexistant");

    var compte = await _repository.Add(c);
    return CreatedAtAction(nameof(GetCompte), new { id = compte.Id }, compte);   // 201
}`},
    {t:'p',v:"Ici le contrôleur a aussi besoin de <code>_context</code> (le repository n'a pas de méthode pour chercher un client) : on l'injecte dans le constructeur comme le repository."},
    {t:'code',cap:"Créer une opération (la plus complète)",v:R`[HttpPost("operation")]
public async Task<ActionResult<Operation>> CreateOperation(Operation p)
{
    var compte = await _repository.GetById(p.CompteID);
    if (compte == null)
        return NotFound("Compte inexistant");

    if (p.TypeOperation == "Retrait" && compte.Solde < p.Montant)
        return BadRequest("Solde insuffisant");

    var operation = await _repository.Add(p);            // enregistrer l'opération
    await _repository.Maj_solde(compte.NuméroCompte, p);  // mettre à jour le solde
    return Ok(operation);
}`},

    { id:"q3m9", title:"Maj_solde",
      enonce:"« met à jour le solde d'un compte suite à une opération de type retrait ou versement. »",
      given:R`public async Task<Compte> Maj_solde(int numcompte, Operation o)`,
      checks:[
        [R`Maj_solde\s*\(\s*int\s+\w+\s*,\s*Operation\s+\w+\s*\)`,"signature Maj_solde(int numcompte, Operation o)",""],
        [R`FirstOrDefaultAsync\s*\(\s*(\w+)\s*=>\s*\1\.`+N+R`\s*==`,"chercher le compte par NuméroCompte","FindAsync cherche par Id : ici il faut FirstOrDefaultAsync(c => c.NuméroCompte == numcompte)"],
        [R`"Retrait"`,"cas \"Retrait\"",""],
        [R`Solde\s*-=|Solde\s*=\s*\w+\.Solde\s*-`,"Retrait → Solde -= Montant",""],
        [R`"Versement"`,"cas \"Versement\"",""],
        [R`Solde\s*\+=|Solde\s*=\s*\w+\.Solde\s*\+`,"Versement → Solde += Montant",""],
        [R`SaveChangesAsync\s*\(`,"SaveChangesAsync()",""]],
      sol:R`public async Task<Compte?> Maj_solde(int numcompte, Operation o)
{
    var compte = await _context.Comptes.FirstOrDefaultAsync(c => c.NuméroCompte == numcompte);
    if (compte != null)
    {
        if (o.TypeOperation == "Retrait")
            compte.Solde -= o.Montant;
        else if (o.TypeOperation == "Versement")
            compte.Solde += o.Montant;
        await _context.SaveChangesAsync();
    }
    return compte;
}`, expl:"EF détecte le changement de <code>Solde</code> et génère l'UPDATE au <code>SaveChangesAsync</code>." },
    { id:"q3m10", title:"Extrait_Compte",

    { id:"q3m12", title:"MAJVirement",

{

    { id:"q6a6", title:"CreateOperation",
      enonce:"« Ajoute une opération de retrait ou versement à un compte, si le type de l'opération est “Retrait” et le solde du compte est insuffisant retourne un badrequest avec un message d'erreur, sinon mise à jour du solde du compte »",
      given:R`[HttpPost]
public async Task<ActionResult<Operation>> CreateOperation(Operation p)`,
      checks:[
        [R`\[HttpPost\]`,"pas de [HttpPost] sans route","Deux [HttpPost] sans route = conflit avec CreateCompte : [HttpPost(\"operation\")]",true],
        [R`\[HttpPost\s*\(\s*"\w+`,"[HttpPost(\"operation\")]",""],
        [R`GetById\s*\(\s*p\.CompteI[Dd]\s*\)`,"charger le compte (GetById(p.CompteID))",""],
        [R`"Retrait"`,"test \"Retrait\"",""],
        [R`Solde\s*<\s*p\.Montant|p\.Montant\s*>\s*\w+\.Solde`,"Solde < Montant",""],
        [R`BadRequest\s*\(`,"BadRequest(\"Solde insuffisant\")",""],
        [R`\.Add\s*\(\s*p\s*\)`,"_repository.Add(p)",""],
        [R`Maj_solde\s*\(`,"_repository.Maj_solde(...)","« sinon mise à jour du solde du compte »"]],
      sol:R`[HttpPost("operation")]
public async Task<ActionResult<Operation>> CreateOperation(Operation p)
{
    var compte = await _repository.GetById(p.CompteID);
    if (compte == null)
        return NotFound("Compte inexistant");

    if (p.TypeOperation == "Retrait" && compte.Solde < p.Montant)
        return BadRequest("Solde insuffisant");

    var operation = await _repository.Add(p);
    await _repository.Maj_solde(compte.NuméroCompte, p);
    return Ok(operation);
}`, expl:"Charger → vérifier → agir (enregistrer + mettre à jour le solde) → répondre." },

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* coloration syntaxique C# simple */
const KW = new Set(('using namespace public private protected readonly class interface async await return var new if else get set null true false this base static void int double string bool decimal foreach for in is not out ref const nameof').split(' '));
function hl(src){
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|\b(\d+(?:\.\d+)?)\b|([A-Za-zÀ-ÿ_][\wÀ-ÿ]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="k5">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="k4">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="k6">' + m[3] + '</span>';
    else {
      const w = m[4], nx = src[re.lastIndex];
      if (KW.has(w)) out += '<span class="k1">' + w + '</span>';
      else if (nx === '(') out += '<span class="k3">' + w + '</span>';
      else if (/^[A-Z]/.test(w)) out += '<span class="k2">' + w + '</span>';
      else out += w;
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

const norm = s => s.replace(/\s+/g, '');

function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function lessonTotals(i){
  const L = LESSONS[i]; let ok = 0;
  L.qcm.forEach((q, j) => { if (S.q[i+'-'+j] === q.a) ok++; });
  L.fills.forEach((f, j) => { if (S.cl[i+'-'+j]) ok++; });
  return { ok, tot: L.qcm.length + L.fills.length };
}

function updateScores(){
  let ok = 0, tot = 0;
  LESSONS.forEach((L, i) => {
    const t = lessonTotals(i); ok += t.ok; tot += t.tot;
    const sc = document.getElementById('sc' + i);
    if (sc){ sc.textContent = t.ok + '/' + t.tot; sc.classList.toggle('full', t.ok === t.tot); }
  });
  const xok = EXAM_ITEMS.filter(it => S.xc[it.id]).length;
  ok += xok; tot += EXAM_ITEMS.length;
  const scx = document.getElementById('scx');
  if (scx){ scx.textContent = xok + '/' + EXAM_ITEMS.length; scx.classList.toggle('full', xok === EXAM_ITEMS.length); }
  const exs = document.getElementById('exsum');
  if (exs) exs.textContent = '✅ ' + xok + ' / ' + EXAM_ITEMS.length + ' questions validées';
  const p = tot ? Math.round(ok / tot * 100) : 0;
  document.getElementById('gbar').style.width = p + '%';
  document.getElementById('glbl').textContent = 'Progression : ' + ok + ' / ' + tot + ' réussis (' + p + ' %)';
}

/* ---------- rendu d'un bloc de cours ---------- */
function renderBlock(b){
  switch (b.t){
    case 'h': return el('h3', '', b.v);
    case 'p': return el('p', '', b.v);
    case 'list': return el('ul', '', b.v.map(x => '<li>' + x + '</li>').join(''));
    case 'note': return el('div', 'note ' + (b.kind === 'key' ? '' : b.kind), b.v);
    case 'table': {
      const d = el('div', 'tbl');
      d.innerHTML = '<table><thead><tr>' + b.head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
        b.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      return d;
    }
    case 'flow': {
      const d = el('div', 'flow');
      d.innerHTML = b.v.map(s => '<div class="st"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>').join('<div class="ar">→</div>');
      return d;
    }
    case 'code': {
      const f = document.createDocumentFragment();
      if (b.cap) f.appendChild(el('div', 'cap', b.cap));
      const pre = el('pre', 'code'); pre.innerHTML = hl(b.v); f.appendChild(pre);
      return f;
    }
  }
}

function renderQcm(i, j, q){
  const id = i + '-' + j, box = el('div', 'q');
  box.appendChild(el('div', 'qt', '<span class="n">' + (j+1) + '.</span>' + q.q));
  const opts = el('div', 'opts'), ex = el('div', 'expl');
  const btns = q.o.map((o, k) => {
    const b = el('button', 'opt', '<span class="l">' + 'ABCD'[k] + '</span><span>' + o + '</span>');
    b.onclick = () => answer(k);
    opts.appendChild(b); return b;
  });
  function paint(k){
    btns.forEach((b, x) => { b.disabled = true; if (x === q.a) b.classList.add('good'); else if (x === k) b.classList.add('wrong'); });
    const ok = k === q.a;
    ex.className = 'expl show ' + (ok ? 'ok' : 'ko');
    ex.innerHTML = (ok ? '✅ <b>Bonne réponse.</b> ' : '❌ <b>Pas tout à fait.</b> ') + q.e;
  }
  function answer(k){ S.q[id] = k; save(); paint(k); updateScores(); }
  box.appendChild(opts); box.appendChild(ex);
  if (S.q[id] != null) paint(S.q[id]);
  return box;
}

/* ---------- code à compléter ---------- */
function renderFill(i, j, f){
  const id = i + '-' + j, box = el('div', 'ex');
  box.appendChild(el('h4', '', '🧩 ' + f.title));
  if (f.desc) box.appendChild(el('p', 'd', f.desc));
  const pre = el('pre', 'code'), inputs = [];
  const parts = f.code.split(/⟦([^⟧]*)⟧/);
  const saved = S.f[id] || [];
  parts.forEach((p, k) => {
    if (k % 2 === 0) { const s = document.createElement('span'); s.innerHTML = hl(p); pre.appendChild(s); }
    else {
      const ans = p.split('‖'), inp = document.createElement('input');
      inp.className = 'blank'; inp.spellcheck = false; inp.autocomplete = 'off';
      inp.size = Math.max(3, Math.max(...ans.map(a => a.length)) + 1);
      inp.value = saved[inputs.length] || '';
      inp.dataset.ans = JSON.stringify(ans);
      inp.addEventListener('input', () => { inp.className = 'blank'; S.f[id] = inputs.map(x => x.value); save(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      inputs.push(inp); pre.appendChild(inp);
    }
  });
  box.appendChild(pre);
  const acts = el('div', 'acts'), res = el('span', 'res');
  const bC = el('button', 'btn primary', 'Vérifier'), bS = el('button', 'btn', 'Voir la réponse'), bE = el('button', 'btn', 'Effacer');
  function check(){
    let good = 0;
    inputs.forEach(x => {
      const ok = JSON.parse(x.dataset.ans).some(a => norm(a) === norm(x.value));
      x.className = 'blank ' + (ok ? 'ok' : 'ko'); if (ok) good++;
    });
    const all = good === inputs.length;
    res.className = 'res ' + (all ? 'ok' : 'ko');
    res.textContent = all ? '✅ Tout est juste !' : good + ' / ' + inputs.length + ' correct(s) — corrige les cases en rouge.';
    if (all) S.cl[id] = true;
    save(); updateScores();
  }
  bC.onclick = check;
  bS.onclick = () => { inputs.forEach(x => { x.value = JSON.parse(x.dataset.ans)[0]; x.className = 'blank shown'; }); res.className = 'res'; res.textContent = 'Réponses affichées en jaune. Efface et réessaie sans regarder !'; S.f[id] = inputs.map(x => x.value); save(); };
  bE.onclick = () => { inputs.forEach(x => { x.value = ''; x.className = 'blank'; }); res.textContent = ''; S.f[id] = []; delete S.cl[id]; save(); updateScores(); };
  acts.append(bC, bS, bE, res); box.appendChild(acts);
  if (S.cl[id]) { inputs.forEach(x => x.className = 'blank ok'); res.className = 'res ok'; res.textContent = '✅ Déjà réussi.'; }
  return box;
}

function runChecks(it, txt){
  const code = txt.replace(/\/\/[^\n]*/g, '');
  return it.checks.map(c => {
    const found = new RegExp(c[0]).test(code);
    return { ok: c[3] ? !found : found, label: c[1], hint: c[2] };
  });
}

  s2.appendChild(renderBlock({t:'table', head:['Dans le PDF','À écrire'], rows: MEMO.errors}));
  wrap.appendChild(s2);
  const s3 = el('section', 'blk cours'); s3.appendChild(el('h2', '', '✅ Refaire le TP seule — liste de contrôle'));
  const ul = el('div', '');
  MEMO.checklist.forEach((t, k) => {
    const id = 'ck' + k, lab = el('label', '', '');
    lab.style.cssText = 'display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!S[id]; cb.style.marginTop = '5px';
    cb.onchange = () => { S[id] = cb.checked; save(); };
    lab.appendChild(cb); lab.appendChild(el('span', '', t)); ul.appendChild(lab);
  });
  s3.appendChild(ul); wrap.appendChild(s3);
  const pg = el('div', 'pager'), bp = el('button', 'btn', '← ' + EXAM.title);
  bp.onclick = () => show(LESSONS.length); pg.appendChild(bp); wrap.appendChild(pg);
  return wrap;
}

/* ---------- démarrage ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
document.getElementById('theme').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
document.getElementById('reset').onclick = () => {
  if (!confirm('Effacer toutes tes réponses et recommencer ?')) return;
  const t = S.theme; S = { q:{}, f:{}, w:{}, cl:{}, x:{}, xc:{}, theme:t }; save(); location.reload();
};

applyTheme();
buildSide();
const main = document.getElementById('main');
LESSONS.forEach((L, i) => main.appendChild(renderLesson(i)));
main.appendChild(renderExam());
main.appendChild(renderMemo());
updateScores();
const h = parseInt((location.hash.match(/#l(\d+)/) || [])[1], 10);
show(h >= 1 && h <= LESSONS.length + 2 ? h - 1 : (S.cur || 0));
</script>
</body>
