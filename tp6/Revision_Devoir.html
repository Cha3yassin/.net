<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révision Devoir TP6</title>
<style>
:root{
  --bg:#f6f7fb; --panel:#ffffff; --panel2:#f0f2f8; --text:#1d2233; --muted:#5d6479; --border:#dfe3ee;
  --accent:#4f46e5; --accent-soft:#eceafd; --ok:#15803d; --ok-soft:#e5f6ea; --bad:#b91c1c; --bad-soft:#fdeaea;
  --warn:#b45309; --warn-soft:#fdf3e1; --key:#0e7490; --key-soft:#e2f5f8;
  --code-bg:#1e2130; --code-text:#e6e9f2; --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11131a; --panel:#191c26; --panel2:#20242f; --text:#e7e9f0; --muted:#9aa1b5; --border:#2c3140;
    --accent:#8b83ff; --accent-soft:#25234a; --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1a1a;
    --warn:#fbbf24; --warn-soft:#352a12; --key:#5fd3e6; --key-soft:#123038;
    --code-bg:#0d0f15; --code-text:#e6e9f2; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11131a; --panel:#191c26; --panel2:#20242f; --text:#e7e9f0; --muted:#9aa1b5; --border:#2c3140;
  --accent:#8b83ff; --accent-soft:#25234a; --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1a1a;
  --warn:#fbbf24; --warn-soft:#352a12; --key:#5fd3e6; --key-soft:#123038;
  --code-bg:#0d0f15; --code-text:#e6e9f2; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code,pre,textarea,.blank{font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;line-height:1.2}
.prog{flex:1;min-width:120px}
.prog .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.prog .lbl{font-size:12px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px 20px 80px}
nav.side{position:sticky;top:76px;align-self:start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
nav.side button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--text);padding:9px 10px;border-radius:9px;cursor:pointer;font:inherit;font-size:14.5px}
nav.side button:hover{background:var(--panel2)}
nav.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .num{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:12.5px;font-weight:700}
nav.side button.on .num{background:var(--accent);color:#fff}
nav.side .sc{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav.side .sc.full{color:var(--ok);font-weight:700}
main{min-width:0}

/* ---------- lesson ---------- */
.hero{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:22px}
.hero .k{opacity:.85;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.hero h1{margin:4px 0 6px;font-size:28px;line-height:1.25}
.hero p{margin:0;opacity:.92}
.hero .pdf{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;font-size:13px}
section.blk{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 26px;margin-bottom:20px;box-shadow:var(--shadow)}
section.blk>h2{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px}
section.blk>h2 .tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.cours h3{font-size:17px;margin:22px 0 8px;color:var(--accent)}
.cours h3:first-child{margin-top:0}
.cours p{margin:8px 0}
.cours ul{margin:8px 0;padding-left:22px}
.cours li{margin:4px 0}
:not(pre)>code{background:var(--panel2);border:1px solid var(--border);padding:1px 5px;border-radius:5px;font-size:.88em}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14.5px}
.tbl{overflow-x:auto}
th,td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600}
.note{border-left:4px solid var(--key);background:var(--key-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.tip{border-color:var(--ok);background:var(--ok-soft)}
.note b.t{display:block;margin-bottom:2px}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:12px 0}
.flow .st{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.flow .st b{display:block}
.flow .st span{font-size:12.5px;color:var(--muted)}
.flow .ar{align-self:center;color:var(--accent);font-weight:700}

/* ---------- code ---------- */
pre.code{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.8px;line-height:1.6;margin:10px 0;tab-size:4}
.cap{font-size:12.5px;color:var(--muted);margin:10px 0 -6px}
.k1{color:#c792ea}.k2{color:#7fdbca}.k3{color:#ffcb6b}.k4{color:#f78c6c}.k5{color:#7a8299;font-style:italic}.k6{color:#addb67}

/* ---------- QCM ---------- */
.q{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--panel)}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qt .n{color:var(--accent);margin-right:6px}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:8px 12px;cursor:pointer;background:var(--panel);text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.expl{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:14.5px;display:none}
.expl.show{display:block}
.expl.ok{background:var(--ok-soft)}
.expl.ko{background:var(--bad-soft)}

/* ---------- fill / write ---------- */
.ex{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:14px 0}
.ex h4{margin:0 0 4px;font-size:16px}
.ex .d{color:var(--muted);font-size:14.5px;margin:0 0 6px}
.blank{background:#2a2f44;color:#fff;border:0;border-bottom:2px dashed #8b83ff;border-radius:4px;padding:0 4px;font-size:13.5px;outline:none;min-width:2.5ch}
.blank:focus{background:#353b57;border-bottom-style:solid}
.blank.ok{border-bottom:2px solid #4ade80;background:#173524}
.blank.ko{border-bottom:2px solid #f87171;background:#3f1d1d}
.blank.shown{border-bottom:2px solid #fbbf24;background:#3a3016}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.res{font-size:14px;font-weight:600}
.res.ok{color:var(--ok)}.res.ko{color:var(--bad)}
textarea.w{width:100%;min-height:170px;background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.8px;line-height:1.55;resize:vertical;tab-size:4}
.sol{display:none}
.sol.show{display:block}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:10px}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:16px 16px 70px}
  nav.side{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}
  nav.side button{flex:none;width:auto;white-space:nowrap}
  nav.side .sc,nav.side .tx{display:none}
  .top-in{padding:10px 16px;flex-wrap:wrap}
  .brand small{display:none}
  section.blk{padding:16px}
  .hero{padding:20px}
  .hero h1{font-size:22px}
}
@media print{
  header.top,nav.side,.acts,.pager,.btn{display:none!important}
  .wrap{display:block;padding:0}
  .lesson{display:block!important;page-break-after:always}
  .sol,.expl{display:block!important}
  section.blk{box-shadow:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">C#</div><div>Révision Devoir<small>TP6 · TP7 · chapitres 1 à 5</small></div></div>
    <div class="prog"><div class="bar"><i id="gbar"></i></div><div class="lbl" id="glbl"></div></div>
    <button class="btn" id="theme" title="Changer de thème">◐ Thème</button>
    <button class="btn" id="reset" title="Effacer toutes mes réponses">↺ Recommencer</button>
  </div>
</header>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   CONTENU — devoir TP6 : compléments des chapitres 1 à 5
   Blocs de cours : h (titre), p (html), code (texte brut), table, note, list, flow
   Code à compléter : ⟦réponse⟧  —  plusieurs réponses acceptées : ⟦a‖b⟧
   ===================================================================== */
const R = String.raw;

const LESSONS = [
/* ---------------------------------------------------------------- 1 */
{
  title:"ASP.NET Core et REST : les bases",
  pdf:"Chapitre 1 + Chapitre 5",
  intro:"Les questions de cours du devoir : ce qu'est ASP.NET Core, à quoi sert chaque fichier du projet, et les règles d'une API REST.",
  cours:[
    {t:'h',v:".NET Core et ASP.NET Core"},
    {t:'list',v:[
      "<b>.NET Core</b> : plate-forme <b>gratuite, open source et multiplateforme</b> (Windows, macOS, Linux) de Microsoft. On l'étend avec des <b>packages NuGet</b> (architecture <b>modulaire</b>).",
      "<b>ASP.NET Core</b> : le framework web de .NET Core. <b>Un seul modèle pour MVC et Web API</b> (avant, c'étaient deux frameworks séparés).",
      "Atouts à citer : multiplateforme, rapide (on n'inclut que les packages utiles), <b>conteneur IoC intégré</b> pour l'injection de dépendances, hébergement sur IIS, Apache, Nginx, Docker.",
      "Composition de .NET Core : <b>CLI</b> (outils en ligne de commande), <b>Roslyn</b> (compilateur C#/VB), <b>CoreFX</b> (bibliothèques), <b>CoreCLR</b> (le runtime)."]},
    {t:'h',v:"Les fichiers d'un projet"},
    {t:'table',head:["Fichier","Rôle","Dans le TP6"],rows:[
      ["<code>.csproj</code>","framework cible, références des packages NuGet","<code>net10.0</code>, EF Core SqlServer/Tools/Design"],
      ["<code>Properties/launchSettings.json</code>","profils de lancement (URL, port, variable d'environnement)","<code>https://localhost:7159</code>, <code>launchUrl: swagger</code>"],
      ["<code>appsettings.json</code>","configuration de l'application (remplace l'ancien <code>web.config</code>)","la chaîne de connexion <code>DbConnection</code>"],
      ["<code>Program.cs</code>","① inscription des <b>services</b> ② configuration du <b>pipeline de middlewares</b>","<code>AddDbContext</code>, <code>AddScoped</code>, <code>UseSwagger</code>…"],
      ["<code>wwwroot/</code>","fichiers statiques (css, js, images), servis par <code>app.UseStaticFiles()</code>","pas utilisé dans une API"]]},
    {t:'h',v:"Program.cs en deux parties"},
    {t:'code',v:R`var builder = WebApplication.CreateBuilder(args);

// ───── ① SERVICES : ce que l'application sait fournir (injection) ─────
builder.Services.AddControllers();
builder.Services.AddEndpointsApiExplorer();
builder.Services.AddSwaggerGen();
builder.Services.AddDbContext<AppDbContext>(o =>
    o.UseSqlServer(builder.Configuration.GetConnectionString("DbConnection")));
builder.Services.AddScoped<ICompteRepository, CompteRepository>();

var app = builder.Build();

// ───── ② PIPELINE : les middlewares, exécutés DANS L'ORDRE à chaque requête ─────
if (app.Environment.IsDevelopment())
{
    app.UseSwagger();          // Swagger seulement en développement
    app.UseSwaggerUI();
}
app.UseHttpsRedirection();
app.UseAuthorization();
app.MapControllers();
app.Run();`},
    {t:'h',v:"Les middlewares"},
    {t:'list',v:[
      "Un <b>middleware</b> est un composant qui traite une requête ou une réponse HTTP, avec un rôle précis : authentifier, gérer les erreurs, servir des fichiers statiques…",
      "Ils forment un <b>pipeline</b> : chacun peut traiter la requête puis la passer au suivant, ou <b>s'arrêter</b> sans appeler le suivant.",
      "Ils s'exécutent <b>dans l'ordre où ils sont ajoutés</b> dans <code>Program.cs</code>."]},
    {t:'h',v:"Les environnements"},
    {t:'p',v:"La variable <code>ASPNETCORE_ENVIRONMENT</code> (définie dans <code>launchSettings.json</code>) vaut en général <b>Development</b>, <b>Staging</b> ou <b>Production</b>. On la teste avec <code>IsDevelopment()</code>, <code>IsStaging()</code>, <code>IsProduction()</code>. Si elle est définie à la fois dans launchSettings.json et dans le système, <b>launchSettings.json gagne</b>."},
    {t:'h',v:"REST : ressource + URI + verbe"},
    {t:'p',v:"Une <b>ressource</b> est une entité de données (Compte, Client, Operation). La <b>combinaison URI + verbe HTTP</b> dit à l'API quoi faire :"},
    {t:'table',head:["URI","Verbe","Résultat"],rows:[
      ["<code>/api/Compte</code>","GET","la liste des comptes"],
      ["<code>/api/Compte/1</code>","GET","le compte d'Id 1"],
      ["<code>/api/Compte</code>","POST","crée un compte"],
      ["<code>/api/Compte/1</code>","PUT","modifie <b>tout</b> le compte 1"],
      ["<code>/api/Compte/1</code>","PATCH","modifie <b>une partie</b> du compte 1"],
      ["<code>/api/Compte/1</code>","DELETE","supprime le compte 1"]]},
    {t:'note',kind:'key',v:"<b class='t'>À retenir pour le devoir</b>Mêmes URI, verbes différents = actions différentes. C'est pourquoi <code>GET /api/Compte/1</code> et <code>DELETE /api/Compte/1</code> ne sont pas en conflit, mais deux <code>[HttpPost]</code> sans route le sont."}
  ],
  qcm:[
    {q:"Quelle phrase décrit ASP.NET Core ?",o:["Un framework web réservé à Windows","Un framework web open source et multiplateforme, avec un seul modèle pour MVC et Web API","Un système de gestion de base de données","Un langage de programmation"],a:1,e:"Open source, multiplateforme, MVC et Web API unifiés."},
    {q:"Où met-on la chaîne de connexion ?",o:["<code>Program.cs</code>","<code>launchSettings.json</code>","<code>appsettings.json</code>","<code>.csproj</code>"],a:2,e:"Dans <code>appsettings.json</code>, section <code>ConnectionStrings</code>, plutôt que dans le code."},
    {q:"Quelles sont les deux parties de <code>Program.cs</code> ?",o:["Les vues et les modèles","L'inscription des services et le pipeline de middlewares","Les migrations et les tables","Le front et le back"],a:1,e:"Avant <code>builder.Build()</code> : les services. Après : les middlewares."},
    {q:"Dans quel ordre s'exécutent les middlewares ?",o:["Au hasard","Par ordre alphabétique","Dans l'ordre où ils sont ajoutés dans Program.cs","Du dernier au premier"],a:2,e:"L'ordre d'ajout compte."},
    {q:"Quel fichier contient le port et le profil de lancement ?",o:["<code>appsettings.json</code>","<code>Properties/launchSettings.json</code>","<code>Program.cs</code>","<code>wwwroot</code>"],a:1,e:"<code>launchSettings.json</code> contient les profils (http, https, IIS Express)."},
    {q:"Quel verbe modifie <b>une partie</b> d'une ressource ?",o:["PUT","POST","PATCH","GET"],a:2,e:"PUT remplace toute la ressource, PATCH n'en modifie qu'une partie."},
    {q:"Pourquoi <code>app.UseSwagger()</code> est-il dans <code>if (app.Environment.IsDevelopment())</code> ?",o:["Swagger ne marche pas en production","Pour n'exposer la documentation de test qu'en développement","C'est obligatoire en C#","Pour accélérer la compilation"],a:1,e:"On évite d'exposer l'outil de test en production."},
    {q:"Que contient le dossier <code>wwwroot</code> ?",o:["Les migrations","Les contrôleurs","Les fichiers statiques (css, js, images)","La base de données"],a:2,e:"C'est la racine web ; il faut <code>app.UseStaticFiles()</code> pour les servir."}
  ],
  fills:[
    {title:"Program.cs : services puis pipeline",desc:"",code:R`var builder = WebApplication.⟦CreateBuilder⟧(args);

builder.Services.⟦AddControllers⟧();
builder.Services.AddSwaggerGen();

var app = builder.⟦Build⟧();

if (app.Environment.⟦IsDevelopment⟧())
{
    app.UseSwagger();
    app.UseSwaggerUI();
}
app.UseHttpsRedirection();
app.⟦MapControllers⟧();
app.⟦Run⟧();`},
    {title:"Les verbes REST du TP6",desc:"Complète le verbe HTTP de chaque action.",code:R`[⟦HttpGet⟧]                    // liste des comptes
[⟦HttpPost⟧]                   // créer un compte
[⟦HttpPut⟧("{id:int}")]        // modifier tout le compte
[⟦HttpDelete⟧("{id:int}")]     // supprimer le compte`}
  ],
  writes:[
    {title:"Question de cours : explique le rôle de Program.cs",desc:"Réponds en 3-4 phrases, comme dans une copie de devoir.",sol:R`// Réponse type :
// Program.cs est le point d'entrée de l'application. Il a deux rôles :
// 1) Inscrire les services dans le conteneur d'injection de dépendances
//    (AddControllers, AddDbContext<AppDbContext>, AddScoped<ICompteRepository, CompteRepository>).
//    Une fois inscrits, ils peuvent être injectés partout par constructeur.
// 2) Configurer le pipeline de requêtes HTTP avec des middlewares
//    (UseSwagger, UseHttpsRedirection, UseAuthorization, MapControllers),
//    qui s'exécutent dans l'ordre où ils sont ajoutés.`}
  ]
},
/* ---------------------------------------------------------------- 2 */
{
  title:"L'injection de dépendances en détail",
  pdf:"Chapitre 1 + 2 + 5",
  intro:"Pourquoi on injecte au lieu de faire new, les 3 durées de vie des services, et les avantages du repository : des questions très fréquentes en devoir.",
  cours:[
    {t:'h',v:"Le principe"},
    {t:'p',v:"ASP.NET Core appelle <b>service</b> toute classe utilisée par une autre classe. Au lieu de faire <code>new</code>, la classe demande ce dont elle a besoin <b>dans son constructeur</b> (<b>injection par constructeur</b>), et le <b>conteneur IoC</b> intégré la fournit."},
    {t:'code',v:R`public class CompteController : ControllerBase
{
    private readonly ICompteRepository _repository;

    public CompteController(ICompteRepository repository)   // injection par constructeur
    {
        _repository = repository;
    }
}`},
    {t:'note',kind:'warn',v:"<b class='t'>Si le service n'est pas inscrit</b>Erreur au lancement : « <i>Unable to resolve service for type 'ICompteRepository' while attempting to activate 'CompteController'</i> ». Solution : l'inscrire dans <code>Program.cs</code>."},
    {t:'h',v:"Les 3 durées de vie (cycle de vie)"},
    {t:'table',head:["Méthode","Une instance créée…","Exemple d'usage"],rows:[
      ["<code>AddSingleton()</code>","<b>une seule fois</b> pour toute l'application, à la 1<sup>re</sup> demande, puis partagée","un cache, une configuration"],
      ["<code>AddScoped()</code>","<b>une fois par requête HTTP</b> (la même pendant toute la requête)","<b>le repository</b> et le DbContext"],
      ["<code>AddTransient()</code>","<b>à chaque fois</b> qu'on la demande","un petit service sans état"]]},
    {t:'note',kind:'key',v:"<b class='t'>Pourquoi AddScoped pour le repository ?</b><code>AddDbContext</code> inscrit le <code>AppDbContext</code> en <b>Scoped</b>. Le repository qui l'utilise doit donc être <b>Scoped</b> lui aussi : un Singleton garderait le même contexte pour toutes les requêtes de tous les utilisateurs (ASP.NET refuse d'ailleurs cette combinaison au démarrage)."},
    {t:'h',v:"AddDbContext ou AddDbContextPool"},
    {t:'list',v:[
      "<code>AddDbContext&lt;AppDbContext&gt;(...)</code> : un nouveau contexte par requête.",
      "<code>AddDbContextPool&lt;AppDbContext&gt;(...)</code> : réutilise une instance d'un <b>pool</b> si elle est disponible, au lieu d'en créer une nouvelle (plus performant).",
      "Dans les deux cas : <code>UseSqlServer(...)</code> choisit SQL Server, et <code>GetConnectionString(\"Nom\")</code> lit la chaîne dans appsettings.json."]},

  cours:[

    {t:'p',v:"<b>Entity Framework Core</b> est un <b>ORM</b> (mapping objet/relationnel) open source, léger et multiplateforme. C'est une amélioration d'<b>ADO.NET</b> : il automatise l'accès et l'enregistrement des données. Il <b>ne fait pas partie de .NET</b> : on l'installe avec des packages NuGet."},

{
  title:"Ajouter, modifier, supprimer",
  pdf:"Chapitre 3 + Chapitre 5",
  intro:"Les différentes façons d'écrire Add, Update et Delete dans le repository : le cours en montre plusieurs, le devoir peut demander n'importe laquelle.",
  cours:[
    {t:'h',v:"Ajouter"},
    {t:'code',cap:"Version du TP6",v:R`public async Task<Compte> Add(Compte c)
{
    _context.Comptes.Add(c);
    await _context.SaveChangesAsync();
    return c;                         // c a reçu son Id après SaveChanges
}`},
    {t:'code',cap:"Version du cours (chapitre 5) : AddAsync + result.Entity",v:R`public async Task<Compte> Add(Compte c)
{
    var result = await _context.Comptes.AddAsync(c);
    await _context.SaveChangesAsync();
    return result.Entity;             // l'objet suivi par EF
}`},
    {t:'h',v:"Modifier : 3 façons"},
    {t:'code',cap:"① Charger puis copier les propriétés (cours chapitre 5, la plus sûre)",v:R`public async Task<Compte?> update(Compte c)
{
    var result = await _context.Comptes.FirstOrDefaultAsync(x => x.Id == c.Id);
    if (result != null)
    {
        result.NuméroCompte = c.NuméroCompte;
        result.TypeCompte   = c.TypeCompte;
        result.ClientID     = c.ClientID;
        await _context.SaveChangesAsync();
        return result;
    }
    return null;                      // pas trouvé → le contrôleur renverra 404
}`},
    {t:'code',cap:"② Update (TP6)",v:R`_context.Comptes.Update(c);
await _context.SaveChangesAsync();`},
    {t:'code',cap:"③ Attach + EntityState.Modified (cours chapitre 3)",v:R`var entry = _context.Comptes.Attach(c);
entry.State = EntityState.Modified;    // « tout cet objet a changé »
await _context.SaveChangesAsync();`},
    {t:'note',kind:'key',v:"<b class='t'>Différence importante</b>② et ③ écrivent <b>toutes</b> les colonnes avec les valeurs reçues. ① ne copie que ce qu'on choisit : on peut par exemple <b>ne jamais modifier le Solde</b> par un PUT, seulement par des opérations."},
    {t:'h',v:"Supprimer"},
    {t:'code',cap:"Avec FindAsync (TP6) ou FirstOrDefaultAsync (cours)",v:R`public async Task<Compte?> Delete(int CompteId)
{
    var result = await _context.Comptes.FirstOrDefaultAsync(c => c.Id == CompteId);
    // ou : var result = await _context.Comptes.FindAsync(CompteId);
    if (result != null)
    {
        _context.Comptes.Remove(result);
        await _context.SaveChangesAsync();
        return result;
    }
    return null;
}`},

    {t:'h',v:"Rôle des migrations"},
    {t:'p',v:"Les migrations gardent le <b>schéma de la base synchronisé avec les classes</b>. À <b>chaque modification</b> d'une classe du modèle, il faut une nouvelle migration. On les lance dans la <b>Console du Gestionnaire de package</b> ou avec la <b>CLI</b> <code>dotnet ef</code>."},

      ["<code>Update-Database</code>","applique les migrations à la base (exécute <code>Up()</code>)"],
      ["<code>Remove-Migration</code>","supprime la <b>dernière</b> migration, <b>si elle n'est pas appliquée</b>"],
      ["<code>Script-Migration</code>","génère un <b>script SQL</b> à partir des migrations"],
      ["<code>Update-Database &lt;Nom&gt;</code>","ramène la base à l'état après la migration <code>&lt;Nom&gt;</code>"],
      ["<code>get-help Add-Migration</code>","affiche l'aide d'une commande"]]},
    {t:'h',v:"Le contenu d'une migration"},
    {t:'list',v:[
      "<code>[Horodatage]_NomMigration.cs</code> : une classe avec <b>deux méthodes</b> : <code>Up()</code> applique les changements, <code>Down()</code> les <b>annule</b>.",
      "<code>AppDbContextModelSnapshot.cs</code> : l'<b>état actuel</b> du modèle ; créé à la 1<sup>re</sup> migration, mis à jour à chaque suivante.",
      "<code>__EFMigrationsHistory</code> : table créée à la 1<sup>re</sup> exécution ; <b>une ligne par migration appliquée</b>."]},
    {t:'code',cap:"Exemple : ajouter Plafond dans Compte",v:R`public partial class AjoutPlafond : Migration
{
    protected override void Up(MigrationBuilder migrationBuilder)
    {
        migrationBuilder.AddColumn<double>(
            name: "Plafond", table: "Comptes", nullable: false, defaultValue: 0.0);
    }

    protected override void Down(MigrationBuilder migrationBuilder)
    {
        migrationBuilder.DropColumn(name: "Plafond", table: "Comptes");
    }
}`},

    try

    }

  intro:"Le dernier chapitre : découper l'API en 4 couches (Domain, Application, Infrastructure, Présentation) avec des DTO et une couche service. Exemple du cours : la gestion de produits. On l'applique aussi au TP6.",
  cours:[
    {t:'h',v:"Définition"},
    {t:'p',v:"La <b>Clean Architecture</b> est une philosophie de conception qui organise le code en <b>couches distinctes</b> avec des <b>responsabilités claires</b>. Idée clé : <b>séparer les préoccupations</b> pour que chaque couche soit indépendante ; une modification dans une partie a un impact <b>minimal, voire nul</b>, sur les autres."},
    {t:'note',kind:'tip',v:"<b class='t'>L'image du cours : la boulangerie</b><b>Fortement couplé</b> : four → pétrin → emballage ; si le pétrin tombe en panne, <b>tout s'arrête</b>. <b>Clean Architecture</b> : chaque machine fonctionne indépendamment ; la panne reste <b>isolée</b>."},
    {t:'h',v:"Les avantages"},
    {t:'list',v:["<b>Séparation des préoccupations</b> (Separation of Concerns)","<b>Testabilité</b>","<b>Maintenabilité et extensibilité</b>","<b>Flexibilité</b>","<b>Indépendance vis-à-vis des frameworks</b>","<b>Meilleure qualité du code</b>"]},

    {t:'h',v:"Domain : entité avec règles métier"},
    {t:'code',v:R`public class Product
{
    public int Id { get; set; }
    [Required, StringLength(100, MinimumLength = 2)]
    public string Name { get; set; } = null!;
    [StringLength(500)]
    public string? Description { get; set; }
    [Column(TypeName = "decimal(18,2)")]          // type SQL exact pour un prix
    public decimal Price { get; set; }
    [Range(0, int.MaxValue, ErrorMessage = "Stock cannot be negative.")]
    public int Stock { get; set; }

    // Règle métier : prix positif, stock non négatif
    public void ValidateBusinessRules()
    {
        if (Price <= 0)
            throw new InvalidOperationException("Product price must be positive.");
        if (Stock < 0)
            throw new InvalidOperationException("Product stock cannot be negative.");
    }
}`},

    {t:'code',v:R`public interface IProductRepository            // Interfaces/Repositories : travaille avec l'ENTITÉ
{
    Task<IEnumerable<Product>> GetAllAsync();
    Task<Product?> GetByIdAsync(int id);
    Task<Product?> AddAsync(Product product);
    Task UpdateAsync(Product product);
    Task DeleteAsync(int id);
}

public interface IProductService               // Interfaces/Services : travaille avec les DTO
{
    Task<IEnumerable<ProductDTO>> GetAllProductsAsync();
    Task<ProductDTO?> GetProductByIdAsync(int id);
    Task<ProductDTO?> AddProductAsync(CreateProductDTO productDto);
    Task UpdateProductAsync(UpdateProductDTO productDto);
    Task DeleteProductAsync(int id);
}`},
    {t:'code',cap:"ProductService : convertit DTO ↔ entité, applique les règles, appelle le repository",v:R`public class ProductService : IProductService
{
    private readonly IProductRepository _repository;
    public ProductService(IProductRepository repository) { _repository = repository; }

    private ProductDTO MapToDTO(Product product)          // entité → DTO
    {
        return new ProductDTO { Id = product.Id, Name = product.Name,
            Description = product.Description, Price = product.Price, Stock = product.Stock };
    }

    public async Task<IEnumerable<ProductDTO>> GetAllProductsAsync()
    {
        var products = await _repository.GetAllAsync();
        var dtos = new List<ProductDTO>();
        foreach (var product in products)
            dtos.Add(MapToDTO(product));
        return dtos;
    }

    public async Task<ProductDTO?> AddProductAsync(CreateProductDTO productDto)
    {
        var product = new Product                          // DTO → entité
        {
            Name = productDto.Name, Description = productDto.Description,
            Price = productDto.Price, Stock = productDto.Stock
        };
        product.ValidateBusinessRules();                   // règle métier du Domain
        var newProduct = await _repository.AddAsync(product);
        return newProduct != null ? MapToDTO(newProduct) : null;
    }

    public async Task UpdateProductAsync(UpdateProductDTO productDto)
    {
        var product = await _repository.GetByIdAsync(productDto.Id);
        if (product == null) throw new Exception("Product not found.");
        product.Name = productDto.Name;
        product.Description = productDto.Description;
        product.Price = productDto.Price;
        product.Stock = productDto.Stock;
        product.ValidateBusinessRules();
        await _repository.UpdateAsync(product);
    }

    public async Task DeleteProductAsync(int id) => await _repository.DeleteAsync(id);
}`},
    {t:'h',v:"Infrastructure : DbContext avec données initiales, repository"},
    {t:'code',v:R`public class ApplicationDbContext : DbContext
{
    public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options) : base(options) { }

    protected override void OnModelCreating(ModelBuilder modelBuilder)
    {
        base.OnModelCreating(modelBuilder);
        modelBuilder.Entity<Product>().HasData(                 // données insérées par la migration
            new Product { Id = 1, Name = "Laptop", Description = "High-end gaming laptop", Price = 1500.00m, Stock = 10 },
            new Product { Id = 2, Name = "Smartphone", Description = "Latest model smartphone", Price = 800.00m, Stock = 25 });
    }
    public DbSet<Product> Products { get; set; } = null!;
}

public class ProductRepository : IProductRepository
{
    private readonly ApplicationDbContext _context;
    public ProductRepository(ApplicationDbContext context) { _context = context; }

    public async Task<IEnumerable<Product>> GetAllAsync()
        => await _context.Products.AsNoTracking().ToListAsync();     // lecture seule : plus rapide

    public async Task<Product?> GetByIdAsync(int id)
        => await _context.Products.AsNoTracking().FirstOrDefaultAsync(prd => prd.Id == id);

    public async Task<Product?> AddAsync(Product product)
    {
        await _context.Products.AddAsync(product);
        await _context.SaveChangesAsync();
        return product;
    }
    public async Task UpdateAsync(Product product)
    {
        _context.Products.Update(product);
        await _context.SaveChangesAsync();
    }
    public async Task DeleteAsync(int id)
    {
        var product = await _context.Products.FindAsync(id);
        if (product != null) { _context.Products.Remove(product); await _context.SaveChangesAsync(); }
    }
}`},
    {t:'list',v:["<code>OnModelCreating</code> + <code>HasData(...)</code> : <b>seeding</b>, des données de départ ajoutées par la migration.","<code>1500.00m</code> : le <code>m</code> indique un nombre <code>decimal</code>.","<code>AsNoTracking()</code> : EF ne suit pas les objets lus (lecture seule) → plus rapide.","<code>=&gt;</code> après une méthode : corps en une seule expression (raccourci de <code>{ return ...; }</code>)."]},
    {t:'h',v:"Présentation : contrôleur, Program.cs, migration"},
    {t:'code',v:R`[Route("api/[controller]")]
[ApiController]
public class ProductController : ControllerBase
{
    private readonly IProductService _service;              // le contrôleur parle au SERVICE
    public ProductController(IProductService service) { _service = service; }

    [HttpGet]
    public async Task<IEnumerable<ProductDTO>> Get() => await _service.GetAllProductsAsync();

    [HttpGet("{id}")]
    public async Task<ActionResult<ProductDTO>> Get(int id)
    {
        var product = await _service.GetProductByIdAsync(id);
        if (product == null) return NotFound();
        return Ok(product);
    }

    [HttpPost]
    public async Task<IActionResult> Post(CreateProductDTO productDto)
        => Ok(await _service.AddProductAsync(productDto));

    [HttpPut("{id}")]
    public async Task<IActionResult> Put(UpdateProductDTO productDto)
    {
        await _service.UpdateProductAsync(productDto);
        return NoContent();                                 // 204
    }

    [HttpDelete("{id}")]
    public async Task<IActionResult> Delete(int id)
    {
        await _service.DeleteProductAsync(id);
        return NoContent();
    }
}

// Program.cs (projet API)

builder.Services.AddScoped<IProductRepository, ProductRepository>();
builder.Services.AddScoped<IProductService, ProductService>();`},

    {title:"Écris une règle métier dans l'entité Compte",desc:"Méthode Retirer(double montant) : refuse un montant ≤ 0 et un solde insuffisant (InvalidOperationException), sinon retire le montant.",sol:R`public void Retirer(double montant)
{
    if (montant <= 0)
        throw new InvalidOperationException("Le montant doit être positif.");
    if (Solde < montant)
        throw new InvalidOperationException("Solde insuffisant.");
    Solde -= montant;

    {title:"Question de cours : qu'est-ce qu'un middleware ?",desc:"[Ch. 1]",sol:R`// Un middleware est un composant logiciel qui traite une requête ou une réponse HTTP,

// Les middlewares forment un pipeline configuré dans Program.cs : chacun peut traiter

    {title:"Question de cours : expliquer l'injection de dépendances",desc:"[Ch. 1, 2]",sol:R`// Au lieu de créer ses dépendances avec new, une classe les reçoit dans son constructeur
// (injection par constructeur). Le conteneur IoC intégré d'ASP.NET Core les fournit,
// à condition qu'elles soient inscrites dans Program.cs :
//   AddSingleton (une instance pour l'application), AddScoped (une par requête),
//   AddTransient (une à chaque demande).

// par migrations :
//   Add-Migration Nom  → génère une classe avec Up() (appliquer) et Down() (annuler)
//                         et met à jour le ModelSnapshot
//   Update-Database    → exécute Up() ; la table __EFMigrationsHistory garde la trace.`},

//   GET /api/Compte       → liste        GET /api/Compte/1    → un compte
//   POST /api/Compte      → créer        PUT /api/Compte/1    → modifier tout
//   PATCH /api/Compte/1   → modifier une partie   DELETE /api/Compte/1 → supprimer

// responsabilités claires (séparation des préoccupations).
// Couches : Domain (entités, règles métier) ; Application (DTO, interfaces, services) ;
// Infrastructure (DbContext, repositories, services externes) ; Présentation (contrôleurs API).
// Les dépendances vont vers le Domain.

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* coloration syntaxique C# simple */
const KW = new Set(('using namespace public private protected readonly class interface async await return var new if else get set null true false this base static void int double string bool decimal foreach for in is not out ref const nameof').split(' '));
function hl(src){
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|\b(\d+(?:\.\d+)?)\b|([A-Za-zÀ-ÿ_][\wÀ-ÿ]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="k5">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="k4">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="k6">' + m[3] + '</span>';
    else {
      const w = m[4], nx = src[re.lastIndex];
      if (KW.has(w)) out += '<span class="k1">' + w + '</span>';
      else if (nx === '(') out += '<span class="k3">' + w + '</span>';
      else if (/^[A-Z]/.test(w)) out += '<span class="k2">' + w + '</span>';
      else out += w;
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

const norm = s => s.replace(/\s+/g, '');

function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function lessonTotals(i){
  const L = LESSONS[i]; let ok = 0;
  L.qcm.forEach((q, j) => { if (S.q[i+'-'+j] === q.a) ok++; });
  L.fills.forEach((f, j) => { if (S.cl[i+'-'+j]) ok++; });
  return { ok, tot: L.qcm.length + L.fills.length };
}

function updateScores(){
  let ok = 0, tot = 0;
  LESSONS.forEach((L, i) => {
    const t = lessonTotals(i); ok += t.ok; tot += t.tot;
    const sc = document.getElementById('sc' + i);
    if (sc){ sc.textContent = t.ok + '/' + t.tot; sc.classList.toggle('full', t.ok === t.tot); }
  });
  const p = tot ? Math.round(ok / tot * 100) : 0;
  document.getElementById('gbar').style.width = p + '%';
  document.getElementById('glbl').textContent = 'Progression : ' + ok + ' / ' + tot + ' réussis (' + p + ' %)';
}

/* ---------- navigation ---------- */
function buildSide(){
  const side = document.getElementById('side');
  LESSONS.forEach((L, i) => {
    const b = el('button', '', '<span class="num">' + (i+1) + '</span><span class="tx">' + L.title + '</span><span class="sc" id="sc' + i + '"></span>');
    b.onclick = () => show(i);
    side.appendChild(b);
  });
  const m = el('button', '', '<span class="num">★</span><span class="tx">' + MEMO.title + '</span>');
  m.onclick = () => show(LESSONS.length);
  side.appendChild(m);
}

function show(i){
  S.cur = i; save();
  document.querySelectorAll('nav.side button').forEach((b, j) => b.classList.toggle('on', j === i));
  document.querySelectorAll('.lesson').forEach((s, j) => s.style.display = j === i ? 'block' : 'none');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  history.replaceState(null, '', '#l' + (i+1));
}

/* ---------- rendu d'un bloc de cours ---------- */
function renderBlock(b){
  switch (b.t){
    case 'h': return el('h3', '', b.v);
    case 'p': return el('p', '', b.v);
    case 'list': return el('ul', '', b.v.map(x => '<li>' + x + '</li>').join(''));
    case 'note': return el('div', 'note ' + (b.kind === 'key' ? '' : b.kind), b.v);
    case 'table': {
      const d = el('div', 'tbl');
      d.innerHTML = '<table><thead><tr>' + b.head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
        b.rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      return d;
    }
    case 'flow': {
      const d = el('div', 'flow');
      d.innerHTML = b.v.map(s => '<div class="st"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>').join('<div class="ar">→</div>');
      return d;
    }
    case 'code': {
      const f = document.createDocumentFragment();
      if (b.cap) f.appendChild(el('div', 'cap', b.cap));
      const pre = el('pre', 'code'); pre.innerHTML = hl(b.v); f.appendChild(pre);
      return f;
    }
  }
}

/* ---------- QCM ---------- */
function renderQcm(i, j, q){
  const id = i + '-' + j, box = el('div', 'q');
  box.appendChild(el('div', 'qt', '<span class="n">' + (j+1) + '.</span>' + q.q));
  const opts = el('div', 'opts'), ex = el('div', 'expl');
  const btns = q.o.map((o, k) => {
    const b = el('button', 'opt', '<span class="l">' + 'ABCD'[k] + '</span><span>' + o + '</span>');
    b.onclick = () => answer(k);
    opts.appendChild(b); return b;
  });
  function paint(k){
    btns.forEach((b, x) => { b.disabled = true; if (x === q.a) b.classList.add('good'); else if (x === k) b.classList.add('wrong'); });
    const ok = k === q.a;
    ex.className = 'expl show ' + (ok ? 'ok' : 'ko');
    ex.innerHTML = (ok ? '✅ <b>Bonne réponse.</b> ' : '❌ <b>Pas tout à fait.</b> ') + q.e;
  }
  function answer(k){ S.q[id] = k; save(); paint(k); updateScores(); }
  box.appendChild(opts); box.appendChild(ex);
  if (S.q[id] != null) paint(S.q[id]);
  return box;
}

/* ---------- code à compléter ---------- */
function renderFill(i, j, f){
  const id = i + '-' + j, box = el('div', 'ex');
  box.appendChild(el('h4', '', '🧩 ' + f.title));
  if (f.desc) box.appendChild(el('p', 'd', f.desc));
  const pre = el('pre', 'code'), inputs = [];
  const parts = f.code.split(/⟦([^⟧]*)⟧/);
  const saved = S.f[id] || [];
  parts.forEach((p, k) => {
    if (k % 2 === 0) { const s = document.createElement('span'); s.innerHTML = hl(p); pre.appendChild(s); }
    else {
      const ans = p.split('‖'), inp = document.createElement('input');
      inp.className = 'blank'; inp.spellcheck = false; inp.autocomplete = 'off';
      inp.size = Math.max(3, Math.max(...ans.map(a => a.length)) + 1);
      inp.value = saved[inputs.length] || '';
      inp.dataset.ans = JSON.stringify(ans);
      inp.addEventListener('input', () => { inp.className = 'blank'; S.f[id] = inputs.map(x => x.value); save(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      inputs.push(inp); pre.appendChild(inp);
    }
  });
  box.appendChild(pre);
  const acts = el('div', 'acts'), res = el('span', 'res');
  const bC = el('button', 'btn primary', 'Vérifier'), bS = el('button', 'btn', 'Voir la réponse'), bE = el('button', 'btn', 'Effacer');
  function check(){
    let good = 0;
    inputs.forEach(x => {
      const ok = JSON.parse(x.dataset.ans).some(a => norm(a) === norm(x.value));
      x.className = 'blank ' + (ok ? 'ok' : 'ko'); if (ok) good++;
    });
    const all = good === inputs.length;
    res.className = 'res ' + (all ? 'ok' : 'ko');
    res.textContent = all ? '✅ Tout est juste !' : good + ' / ' + inputs.length + ' correct(s) — corrige les cases en rouge.';
    if (all) S.cl[id] = true;
    save(); updateScores();
  }
  bC.onclick = check;
  bS.onclick = () => { inputs.forEach(x => { x.value = JSON.parse(x.dataset.ans)[0]; x.className = 'blank shown'; }); res.className = 'res'; res.textContent = 'Réponses affichées en jaune. Efface et réessaie sans regarder !'; S.f[id] = inputs.map(x => x.value); save(); };
  bE.onclick = () => { inputs.forEach(x => { x.value = ''; x.className = 'blank'; }); res.textContent = ''; S.f[id] = []; delete S.cl[id]; save(); updateScores(); };
  acts.append(bC, bS, bE, res); box.appendChild(acts);
  if (S.cl[id]) { inputs.forEach(x => x.className = 'blank ok'); res.className = 'res ok'; res.textContent = '✅ Déjà réussi.'; }
  return box;
}

/* ---------- écris le code ---------- */
function renderWrite(i, j, w){
  const id = i + '-' + j, box = el('div', 'ex');
  box.appendChild(el('h4', '', '✍️ ' + w.title));
  box.appendChild(el('p', 'd', w.desc));
  const ta = el('textarea', 'w'); ta.spellcheck = false; ta.placeholder = '// écris ton code ici…';
  ta.value = S.w[id] || '';
  ta.addEventListener('input', () => { S.w[id] = ta.value; save(); });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; S.w[id] = ta.value; save(); }
  });
  box.appendChild(ta);
  const sol = el('div', 'sol'); sol.innerHTML = '<div class="cap">Correction</div><pre class="code">' + hl(w.sol) + '</pre>';
  const acts = el('div', 'acts'), bS = el('button', 'btn primary', 'Voir la correction');
  bS.onclick = () => { const on = sol.classList.toggle('show'); bS.textContent = on ? 'Cacher la correction' : 'Voir la correction'; };
  acts.appendChild(bS); box.appendChild(acts); box.appendChild(sol);
  return box;
}

/* ---------- une leçon ---------- */
function renderLesson(i){
  const L = LESSONS[i], wrap = el('div', 'lesson');
  wrap.appendChild(el('div', 'hero', '<div class="k">Leçon ' + (i+1) + ' / ' + LESSONS.length + '</div><h1>' + L.title + '</h1><p>' + L.intro + '</p><span class="pdf">📚 Cours : ' + L.pdf + '</span>'));

  const c = el('section', 'blk cours'); c.appendChild(el('h2', '', '📘 Cours'));
  L.cours.forEach(b => c.appendChild(renderBlock(b))); wrap.appendChild(c);

  const q = el('section', 'blk'); q.appendChild(el('h2', '', '❓ QCM <span class="tag">' + L.qcm.length + ' questions</span>'));
  q.appendChild(el('p', 'd', 'Clique sur une réponse : la correction s\'affiche tout de suite.'));
  L.qcm.forEach((x, j) => q.appendChild(renderQcm(i, j, x))); wrap.appendChild(q);

  const f = el('section', 'blk'); f.appendChild(el('h2', '', '🧩 Code à compléter <span class="tag">' + L.fills.length + ' exercices</span>'));
  f.appendChild(el('p', 'd', 'Tape dans les cases violettes, puis « Vérifier » (ou Entrée). Majuscules et symboles comptent, comme en C#.'));
  L.fills.forEach((x, j) => f.appendChild(renderFill(i, j, x))); wrap.appendChild(f);

  const w = el('section', 'blk'); w.appendChild(el('h2', '', '✍️ Écris le code <span class="tag">' + L.writes.length + ' exercice' + (L.writes.length > 1 ? 's' : '') + '</span>'));
  w.appendChild(el('p', 'd', 'Écris le code toi-même sans regarder le cours, puis compare avec la correction. Ton texte est gardé dans le navigateur.'));
  L.writes.forEach((x, j) => w.appendChild(renderWrite(i, j, x))); wrap.appendChild(w);

  const pg = el('div', 'pager');
  const bp = el('button', 'btn', '← Leçon précédente'), bn = el('button', 'btn primary', i === LESSONS.length - 1 ? MEMO.title + ' →' : 'Leçon suivante →');
  if (i === 0) bp.style.visibility = 'hidden';
  bp.onclick = () => show(i - 1); bn.onclick = () => show(i + 1);
  pg.append(bp, bn); wrap.appendChild(pg);
  return wrap;
}

function renderMemo(){
  const wrap = el('div', 'lesson');
  wrap.appendChild(el('div', 'hero', '<div class="k">Récapitulatif</div><h1>' + MEMO.title + '</h1><p>' + MEMO.intro + '</p>'));
  MEMO.sections.forEach(sec => {
    const s = el('section', 'blk cours'); s.appendChild(el('h2', '', sec.title));
    s.appendChild(renderBlock({t:'table', head: sec.head, rows: sec.rows}));
    wrap.appendChild(s);
  });
  const s3 = el('section', 'blk cours'); s3.appendChild(el('h2', '', '✅ Suis-je prête pour le devoir ?'));
  const ul = el('div', '');
  MEMO.checklist.forEach((t, k) => {
    const id = 'ck' + k, lab = el('label', '', '');
    lab.style.cssText = 'display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!S[id]; cb.style.marginTop = '5px';
    cb.onchange = () => { S[id] = cb.checked; save(); };
    lab.appendChild(cb); lab.appendChild(el('span', '', t)); ul.appendChild(lab);
  });
  s3.appendChild(ul); wrap.appendChild(s3);
  const pg = el('div', 'pager'), bp = el('button', 'btn', '← Leçon ' + LESSONS.length);
  bp.onclick = () => show(LESSONS.length - 1); pg.appendChild(bp); wrap.appendChild(pg);
  return wrap;
}

/* ---------- démarrage ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
document.getElementById('theme').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
document.getElementById('reset').onclick = () => {
  if (!confirm('Effacer toutes tes réponses et recommencer ?')) return;
  const t = S.theme; S = { q:{}, f:{}, w:{}, cl:{}, theme:t }; save(); location.reload();
};

applyTheme();
buildSide();
const main = document.getElementById('main');
LESSONS.forEach((L, i) => main.appendChild(renderLesson(i)));
main.appendChild(renderMemo());
updateScores();
const h = parseInt((location.hash.match(/#l(\d+)/) || [])[1], 10);
show(h >= 1 && h <= LESSONS.length + 1 ? h - 1 : (S.cur || 0));
</script>
